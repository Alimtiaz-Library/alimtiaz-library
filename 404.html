<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — الصفحة غير موجودة | مكتبة الامتياز</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            color: #fff;
            font-family: 'Cairo', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 2rem;
            gap: 1rem;
        }
        .icon { font-size: 5rem; animation: bounce 2s infinite; }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
        h1 {
            font-size: 6rem;
            font-weight: 900;
            background: linear-gradient(135deg, #c5a059, #f9e27d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1;
        }
        h2 { font-size: 1.4rem; font-weight: 800; color: #c5a059; }
        p { color: #8c7b60; font-size: 0.95rem; max-width: 300px; line-height: 1.7; }
        .btn-home {
            margin-top: 1rem;
            background: linear-gradient(135deg, #c5a059, #8e7345);
            color: #000;
            padding: 1rem 2.5rem;
            border-radius: 9999px;
            font-family: 'Cairo', sans-serif;
            font-size: 1rem;
            font-weight: 900;
            text-decoration: none;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 8px 24px rgba(197, 160, 89, 0.35);
        }
        .btn-home:hover {
            transform: translateY(-3px);
            box-shadow: 0 14px 32px rgba(197, 160, 89, 0.5);
        }
    </style>
</head>
<body>
    <div class="icon">📚</div>
    <h1>404</h1>
    <h2>الصفحة غير موجودة</h2>
    <p>يبدو أن الصفحة التي تبحث عنها غير موجودة أو تم تغيير رابطها.</p>
    <a href="/" class="btn-home">🏠 العودة للرئيسية</a>
</body>
</html>
